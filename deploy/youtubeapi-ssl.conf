<VirtualHost *:443>
    ServerName youtubeapi.bibliafoco.com.br
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/youtubeapi.bibliafoco.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/youtubeapi.bibliafoco.com.br/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 75
    ProxyPass / http://127.0.0.1:3011/ connectiontimeout=5 timeout=75 retry=0
    ProxyPassReverse / http://127.0.0.1:3011/
    LimitRequestBody 2097152
    Header always set X-Content-Type-Options "nosniff"
    Header always set Strict-Transport-Security "max-age=15552000"
    ErrorLog ${APACHE_LOG_DIR}/youtubeapi-error.log
    CustomLog ${APACHE_LOG_DIR}/youtubeapi-access.log combined
</VirtualHost>
