<VirtualHost *:80>
    ServerName youtubeapi.bibliafoco.com.br
    DocumentRoot /var/www/yt-acme
    <Directory /var/www/yt-acme>
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://youtubeapi.bibliafoco.com.br%{REQUEST_URI} [R=308,L,NE]
    ErrorLog ${APACHE_LOG_DIR}/youtubeapi-error.log
    CustomLog ${APACHE_LOG_DIR}/youtubeapi-access.log combined
</VirtualHost>
